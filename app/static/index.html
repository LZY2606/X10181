<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>刀轨审阅台</title>
<style>
:root{--bg:#1e2127;--panel:#272b33;--panel2:#2f343f;--line:#3a404d;
--fg:#d7dce5;--dim:#8b93a3;--a:#5aa9ff;--b:#ffb454;--ok:#46c46a;
--warn:#ffce54;--err:#ff6b6b;--restate:#b18cff;}
*{box-sizing:border-box}
body{margin:0;font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",monospace;
background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
header{padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
.pill{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.pill.equivalent{background:#16351f;color:var(--ok)}
.pill.different{background:#3a2a16;color:var(--b)}
.pill.blocked{background:#3a1d1d;color:var(--err)}
main{flex:1;display:flex;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;flex:1;border-right:1px solid var(--line)}
.col h2{margin:0;padding:6px 10px;font-size:12px;background:var(--panel2);
color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.codewrap{flex:1;overflow:auto;position:relative}
table.codes{border-collapse:collapse;width:100%}
table.codes td{white-space:pre;padding:0 8px;border-left:1px solid var(--line);height:1.55em;vertical-align:middle}
td.lno{color:var(--dim);text-align:right;width:48px;user-select:none;background:var(--panel)}
td.code{cursor:pointer;width:100%}
tr.unchanged td.code{color:var(--fg)}
tr.format td.code{color:var(--restate)}
tr.changed td.code{background:#4a2f1c;color:#ffd9a8}
tr.insert td.code{background:#2f3d24;color:#c7f5a0}
tr.delete td.code{background:#41242a;color:#ffb3bd;text-decoration:line-through}
tr.restate td.code{color:var(--restate)}
tr.affected td.code{box-shadow:inset 3px 0 0 var(--warn)}
tr.selected td{outline:2px solid var(--a);outline-offset:-2px}
tr.unknown td.code{border-bottom:1px dashed var(--err)}
.tag{font-size:10px;padding:0 5px;border-radius:8px;margin-left:6px;color:#111}
.tag.format{background:var(--restate)}.tag.changed{background:var(--b)}
.tag.insert{background:var(--ok)}.tag.delete{background:var(--err);color:#fff}
.tag.restate{background:var(--restate)}
.right{flex:1.35;display:flex;flex-direction:column;background:var(--panel)}
.toolbar{padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
border-bottom:1px solid var(--line)}
button,select,input{font:inherit;background:var(--panel2);color:var(--fg);
border:1px solid var(--line);border-radius:5px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--a)}
canvas{flex:1;width:100%;background:#14161a;display:block;min-height:220px}
#snap{max-height:34%;overflow:auto;border-top:1px solid var(--line);padding:8px 12px;
background:var(--panel);font-size:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 14px}
.kv b{color:var(--dim);font-weight:400;margin-right:6px}
.snapcol{flex:1;min-width:230px}
.snapcol h3{margin:0 0 4px;font-size:12px;color:var(--a)}
.snapcol.b h3{color:var(--b)}
.violation{padding:4px 8px;border-radius:4px;margin:3px 0}
.violation.error{background:#3a1d1d;color:#ffb3bd}
.violation.warning{background:#3a331a;color:#ffe9a8}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
align-items:center;justify-content:center;z-index:10}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:8px;
padding:18px;width:460px;max-width:92vw}
.modal h3{margin:0 0 10px}
.modal label{display:block;margin:8px 0 2px;color:var(--dim)}
.modal input,.modal select,.modal textarea{width:100%}
.muted{color:var(--dim);font-size:11px}
.forkbar{padding:4px 10px;font-size:11px;border-top:1px solid var(--line);
background:var(--panel2);max-height:22%;overflow:auto}
.forkitem{cursor:pointer;padding:2px 6px;border-radius:4px}
.forkitem:hover{background:#333a47}
textarea.src{width:100%;height:70px;background:#14161a;color:var(--fg);border:1px solid var(--line)}
.srcrow{padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
</style>
</head>
<body>
<header>
  <h1>刀轨审阅台</h1>
  <label>机型 <input id="machine" value="FANUC-0i" size="10"></label>
  <label>版本 <input id="version" value="rev-2026-09" size="12"></label>
  <button id="btnSample">载入示例</button>
  <button id="btnCompare">比较</button>
  <button id="btnExport">导出补丁包</button>
  <span id="verdict" class="muted">尚未比较</span>
</header>
<div class="srcrow">
  <div style="display:flex;gap:10px">
    <div style="flex:1"><div class="muted">原版 G-code（A）</div>
      <textarea class="src" id="srcA" spellcheck="false"></textarea></div>
    <div style="flex:1"><div class="muted">修改版 G-code（B）</div>
      <textarea class="src" id="srcB" spellcheck="false"></textarea></div>
  </div>
</div>
<main>
  <div class="col" id="colA">
    <h2><span>原版 A</span><span id="statA"></span></h2>
    <div class="codewrap"><table class="codes"><tbody id="rowsA"></tbody></table></div>
  </div>
  <div class="col" id="colB">
    <h2><span>修改版 B</span><span id="statB"></span></h2>
    <div class="codewrap"><table class="codes"><tbody id="rowsB"></tbody></table></div>
  </div>
  <div class="right">
    <div class="toolbar">
      <span class="muted">图层</span>
      <label><input type="checkbox" id="layerA" checked> 原版</label>
      <label><input type="checkbox" id="layerB" checked> 修改版</label>
      <label><input type="checkbox" id="layerDiff" checked> 差异</label>
      <label><input type="radio" name="plane" value="XY" checked> XY</label>
      <label><input type="radio" name="plane" value="XZ"> XZ</label>
      <label><input type="radio" name="plane" value="YZ"> YZ</label>
      <span class="muted" id="pickInfo">点击行/刀轨联动</span>
    </div>
    <canvas id="cv"></canvas>
    <div class="forkbar" id="forkbar"></div>
    <div id="snap"></div>
  </div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>确认厂商/未知指令的人工语义</h3>
    <p class="muted">确认仅对指定版本与适用机型生效；无法确定运动语义时，
    系统不会给出“安全无变化”结论。</p>
    <label>指令代码</label><input id="cfCode" readonly>
    <label>原文</label><input id="cfRaw" readonly>
    <label>人工语义效果</label>
    <select id="cfEffect">
      <option value="no_effect">对机床运动/模态无影响（仅信号/注释类）</option>
      <option value="modal_only">仅改变模态（几何等价性需人工负责）</option>
      <option value="motion_unverified">会产生运动，但语义无法离线验证（仍阻止安全结论）</option>
    </select>
    <label>说明</label><textarea id="cfNote" rows="2"></textarea>
    <label>版本 *</label><input id="cfVersion">
    <label>适用机型 *</label><input id="cfMachine">
    <div style="margin-top:12px;text-align:right">
      <button id="cfCancel">取消</button>
      <button id="cfSave">保存确认</button></div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
